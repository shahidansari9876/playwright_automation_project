            - heading "Who’s Welcome? Everyone Who Cares or Needs." [level=2] [ref=f15e288]
            - paragraph [ref=f15e289]: Our platform bridges the gap between helpers and those who need them most—whether for exam assistance, daily tasks, or special events—so everyone can participate fully and confidently.
            - generic [ref=f15e290]:
              - heading "Beneficiaries" [level=3] [ref=f15e291]
              - paragraph [ref=f15e292]: If you have a disability or require extra support, simply request a vetted volunteer to help with reading and writing during exams, navigating daily routines, or enjoying community activities. You set the schedule, describe your needs, and we’ll connect you with a reliable, caring partner who respects your independence and dignity.
            - generic [ref=f15e293]:
              - heading "Volunteers" [level=3] [ref=f15e294]
              - paragraph [ref=f15e295]: Turn a few spare hours into a life-changing gift. Become a trained scribe or personal assistant—whether it’s for an exam, a weekly errand, or a one-off event, your contribution empowers someone to achieve their goals and feel included. No special background required—just compassion and commitment!
