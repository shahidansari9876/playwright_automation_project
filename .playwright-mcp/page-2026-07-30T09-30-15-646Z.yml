        - generic [ref=f15e180]:
          - heading "Empowering Visually Impaired Learners Through Technology, Volunteers, & Inclusion" [level=2] [ref=f15e181]: Empowering Visually Impaired Learners Through Technology,Volunteers, & Inclusion
          - paragraph [ref=f15e182]: Project Quest is a transformative initiative by Save The Quest, backed by the Corporate Social Responsibility (CSR) division of Indian Oil Corporation Limited (IOCL). With IOCL’s crucial support, a dedicated web-based platform has been developed to make education more accessible and inclusive. This collaborative effort aims to empower learners with disabilities, ensuring they receive equal opportunities and resources for a brighter, more inclusive future.
        - generic:
          - 'img "Two girls studying together in a library setting, supported under the IndianOil CSR initiative. Note: IOCL supports this project only in Punjab, HP, J&K, Ladakh, and Chandigarh; other usage is NGO-funded."'
      - generic [ref=f15e184]:
        - heading "Why Is ‘Save The Quest’ Essential Today?" [level=2] [ref=f15e185]
        - generic [ref=f15e186]:
          - generic [ref=f15e187]:
            - generic [ref=f15e188]:
              - img "Championing Uninterrupted Education"
            - heading "Championing Uninterrupted Education" [level=3] [ref=f15e189]
            - paragraph [ref=f15e190]: Save The Quest safeguards learning pathways for visually impaired students by ensuring uninterrupted access to high-quality study materials, exam support, and advocacy. Our platform bridges the gap between learners and volunteers, creating a resilient, supportive network that champions equal educational opportunities regardless of physical challenges.
          - generic [ref=f15e191]:
            - generic [ref=f15e192]:
              - img "Empowering Lives Through Technology"
            - heading "Empowering Lives Through Technology" [level=3] [ref=f15e193]
            - paragraph [ref=f15e194]: At Save The Quest, we leverage innovative tech to transform how visually impaired learners engage with content. From volunteer-recorded audio notes to seamless exam scribes, our solutions boost confidence, independence, and academic success. By combining human compassion with cutting-edge tools, we empower every student to pursue their dreams without barriers.
          - generic [ref=f15e195]:
            - generic [ref=f15e196]:
              - img "Fostering Inclusive Volunteerism"
            - heading "Fostering Inclusive Volunteerism" [level=3] [ref=f15e197]
            - paragraph [ref=f15e198]: Save The Quest cultivates a community of citizen volunteers dedicated to uplifting learners with disabilities. Through easy matchmaking, training, and ongoing support, we enable caring individuals to make a tangible impact. This synergy not only enriches the lives of our students but also fosters broader societal awareness and empathy.
