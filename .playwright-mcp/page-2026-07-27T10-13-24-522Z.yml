        - generic [ref=e168]:
          - heading "Empowering Visually Impaired Learners Through Technology, Volunteers, & Inclusion" [level=2] [ref=e169]: Empowering Visually Impaired Learners Through Technology,Volunteers, & Inclusion
          - paragraph [ref=e170]: Project Quest is a transformative initiative by Save The Quest, backed by the Corporate Social Responsibility (CSR) division of Indian Oil Corporation Limited (IOCL). With IOCL’s crucial support, a dedicated web-based platform has been developed to make education more accessible and inclusive. This collaborative effort aims to empower learners with disabilities, ensuring they receive equal opportunities and resources for a brighter, more inclusive future.
        - generic:
          - 'img "Two girls studying together in a library setting, supported under the IndianOil CSR initiative. Note: IOCL supports this project only in Punjab, HP, J&K, Ladakh, and Chandigarh; other usage is NGO-funded."'
      - generic [ref=e172]:
        - heading "Why Is ‘Save The Quest’ Essential Today?" [level=2] [ref=e173]
        - generic [ref=e174]:
          - generic [ref=e175]:
            - generic [ref=e176]:
              - img "Championing Uninterrupted Education"
            - heading "Championing Uninterrupted Education" [level=3] [ref=e177]
            - paragraph [ref=e178]: Save The Quest safeguards learning pathways for visually impaired students by ensuring uninterrupted access to high-quality study materials, exam support, and advocacy. Our platform bridges the gap between learners and volunteers, creating a resilient, supportive network that champions equal educational opportunities regardless of physical challenges.
          - generic [ref=e179]:
            - generic [ref=e180]:
              - img "Empowering Lives Through Technology"
            - heading "Empowering Lives Through Technology" [level=3] [ref=e181]
            - paragraph [ref=e182]: At Save The Quest, we leverage innovative tech to transform how visually impaired learners engage with content. From volunteer-recorded audio notes to seamless exam scribes, our solutions boost confidence, independence, and academic success. By combining human compassion with cutting-edge tools, we empower every student to pursue their dreams without barriers.
          - generic [ref=e183]:
            - generic [ref=e184]:
              - img "Fostering Inclusive Volunteerism"
            - heading "Fostering Inclusive Volunteerism" [level=3] [ref=e185]
            - paragraph [ref=e186]: Save The Quest cultivates a community of citizen volunteers dedicated to uplifting learners with disabilities. Through easy matchmaking, training, and ongoing support, we enable caring individuals to make a tangible impact. This synergy not only enriches the lives of our students but also fosters broader societal awareness and empathy.
